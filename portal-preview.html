<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nachrichtenportal | Redaktioneller Originalbericht</title>
<style>
:root{font:17px/1.65 system-ui,-apple-system,sans-serif;color:#20242b;background:#f6f7f9}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:24px}
header{background:#fff;border-bottom:1px solid #dfe3e8}header h1{margin:0;font-size:1.5rem}
.controls{margin:20px 0;padding:18px;background:white;border:1px solid #e0e4e9;border-radius:12px}
.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{display:inline-flex;gap:7px;align-items:center;padding:7px 12px;border:1px solid #cbd2da;border-radius:30px;cursor:pointer}
button{padding:8px 14px;border-radius:8px;border:1px solid #abb5c2;background:white;cursor:pointer}
article{padding:24px 32px;background:#fff;border:1px solid #e0e4e9;border-radius:12px;overflow-wrap:anywhere}
article h1{font-size:1.5rem}article h2{font-size:1.2rem;margin-top:1.8em}article p{margin:0 0 1em}
article table{border-collapse:collapse;width:100%;font-size:.9rem}article td,article th{padding:8px;border:1px solid #d8dde4;text-align:left}
.table-scroll{overflow-x:auto;margin:16px 0}article hr{border:0;border-top:1px solid #d8dde4;margin:2em 0}
article a{color:#1256a4}article ul{padding-left:1.4em}.error{color:#9a2424}
@media(max-width:650px){.wrap{padding:12px}article{padding:18px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Nachrichtenportal</h1><div>Der redaktionelle Originalbericht, individuell zusammengestellt</div></div></header>
<main class="wrap">
<section class="controls" aria-label="Themenauswahl">
<label for="date">Berichtsdatum</label> <input type="date" id="date" value="2026-10-16">
<p><strong>Themen auswählen</strong></p>
<div id="choices" class="choices"></div>
<p><label class="choice"><input type="checkbox" id="positive-only"> Nur Positives</label></p>
<p><button type="button" id="all">Alle Themen</button> <button type="button" id="none">Keine Themen</button></p>
<p id="status" role="status"></p>
</section>
<article id="report" aria-label="Redaktioneller Bericht"></article>
</main>
<footer class="wrap"><small>Impressum: Bruno &amp; Dirk Wagner</small></footer>
<script>
"use strict";
const CATEGORIES=[
["international","Internationale Politik"],
["deutschland","Deutschland"],
["europa","Europa / EU"],
["wissenschaft","Wissenschaft"],
["ki","Aktuelle KI / KI-Modelle"],
["natur","Natur und Umwelt"]
];
const selected=new Set(CATEGORIES.map(([id])=>id));
const report=document.getElementById("report");
const status=document.getElementById("status");
const choices=document.getElementById("choices");
let original="";
let sources=[];
let storyMeta=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inline(s){
  let out=esc(s);
  out=out.replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,(_,label,url)=>'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a>');
  out=out.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
  return out;
}
function markdown(s){
  const lines=s.split("\n");let html="",para=[],list=[],table=[];
  function flushPara(){if(para.length){html+="<p>"+para.map(inline).join(" ")+"</p>";para=[];}}
  function flushList(){if(list.length){html+="<ul>"+list.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";list=[];}}
  function flushTable(){if(table.length){html+='<div class="table-scroll"><table>'+table.map((cells,i)=>"<tr>"+cells.map(c=>"<"+(i?"td":"th")+">"+inline(c)+"</"+(i?"td":"th")+">").join("")+"</tr>").join("")+"</table></div>";table=[];}}
  for(const line of lines){
    if(/^\|(?:\s*:?-+:?\s*\|)+\s*$/.test(line))continue;
    if(/^\|.*\|\s*$/.test(line)){flushPara();flushList();table.push(line.trim().slice(1,-1).split("|").map(x=>x.trim()));continue;}
    flushTable();
    const heading=/^(#{1,6})\s+(.+)$/.exec(line);
    if(heading){flushPara();flushList();html+="<h"+heading[1].length+">"+inline(heading[2].replace(/^\d+\.\s+/,""))+"</h"+heading[1].length+">";continue;}
    if(/^\s*---+\s*$/.test(line)){flushPara();flushList();html+="<hr>";continue;}
    const bullet=/^\s*[-*]\s+(.+)$/.exec(line);
    if(bullet){flushPara();list.push(bullet[1]);continue;}
    if(!line.trim()){flushPara();flushList();continue;}
    flushList();para.push(line);
  }
  flushPara();flushList();flushTable();return html;
}
function sections(s){
 const regex=/^# ([^\n]+)(?:\n|$)/gm;const found=[...s.matchAll(regex)];
 if(!found.length)throw Error("Keine Hauptabschnitte im Originalbericht");
 return found.map((m,i)=>({heading:m[1].trim(),text:s.slice(m.index,i+1<found.length?found[i+1].index:s.length)}));
}
function selection(s){
 const parts=sections(s),names=new Map(CATEGORIES.map(([id,name])=>[name,id]));
 const positiveOnly=document.getElementById("positive-only").checked;
 if(!positiveOnly)return parts.filter(p=>!names.has(p.heading)||selected.has(names.get(p.heading))).map(p=>p.text).join("");
 const positiveTitles=new Set(storyMeta.filter(x=>x&&x.positive===true).map(x=>x.title));
 const output=[];
 for(const p of parts){
  const category=names.get(p.heading);
  if(!category||!selected.has(category))continue;
  const lines=p.text.split(/(?=^## )/m);
  const kept=lines.slice(1).filter(block=>{
   const first=block.split("\n",1)[0].replace(/^## /,"").trim();
   return positiveTitles.has(first);
  });
  if(kept.length)output.push(lines[0]+kept.join(""));
 }
 return output.join("");
}
function sourcesHtml(){
 if(!sources.length)return "";
 const seen=new Set();
 const links=sources.filter(s=>s&&typeof s.label==="string"&&typeof s.url==="string"&&s.url.startsWith("https://")&&!seen.has(s.url)&&seen.add(s.url));
 return '<section aria-label="Quellenlinks"><h2>Quellen</h2><ul>'+links.map(s=>'<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+'</a></li>').join("")+"</ul></section>";
}
function render(){
 if(!original)return;
 report.innerHTML=markdown(selection(original))+sourcesHtml();
 status.textContent=selected.size+" von "+CATEGORIES.length+" Themen ausgewählt";
}
for(const [id,name] of CATEGORIES){
 const label=document.createElement("label");label.className="choice";
 const input=document.createElement("input");input.type="checkbox";input.checked=true;input.value=id;
 input.addEventListener("change",()=>{input.checked?selected.add(id):selected.delete(id);render();});
 label.append(input,document.createTextNode(name));choices.append(label);
}
function sync(){choices.querySelectorAll("input").forEach(i=>i.checked=selected.has(i.value));render();}
document.getElementById("all").addEventListener("click",()=>{CATEGORIES.forEach(([id])=>selected.add(id));sync();});
document.getElementById("none").addEventListener("click",()=>{selected.clear();sync();});
async function load(){
 const date=document.getElementById("date").value;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
 status.textContent="Lade Originalbericht…";report.replaceChildren();original="";
 try{
  const response=await fetch("./berichte/"+date+".json",{cache:"no-store"});
  if(!response.ok)throw Error("Bericht nicht verfügbar (HTTP "+response.status+")");
  const data=await response.json();
  if(data.date!==date||typeof data.original_markdown!=="string"||!data.original_markdown.trim())throw Error("Originalbericht fehlt oder Datum stimmt nicht");
  original=data.original_markdown;\n  sources=Array.isArray(data.quellen)?data.quellen:[];\n  if(!sources.length&&Array.isArray(data.stories))sources=data.stories.flatMap(story=>Array.isArray(story.sources)?story.sources:[]);\n  render();
 }catch(e){status.textContent="Fehler: "+e.message;status.className="error";}
}
document.getElementById("date").addEventListener("change",load);
document.getElementById("positive-only").addEventListener("change",render);
load();
</script>
</body></html>
