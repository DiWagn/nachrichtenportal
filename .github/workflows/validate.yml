name: Nachrichtenberichte validieren

on:
  workflow_dispatch:
  push:
    paths:
      - "berichte/**"
      - "scripts/validate_reports.py"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JSON-Syntax und Dateinamen prüfen
        run: python3 scripts/validate_reports.py
