name: Hinweis in Bearbeitung auf Originalseite setzen
on:
  push:
    paths:
      - "scripts/set_maintenance_notice.py"
      - ".github/workflows/update-existing-site.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'paramiko==3.5.1'
      - name: Originalseite sichern und Hinweis einblenden
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_SFTP_HOSTKEY_SHA256: ${{ secrets.IONOS_SFTP_HOSTKEY_SHA256 }}
        run: python3 scripts/set_maintenance_notice.py
