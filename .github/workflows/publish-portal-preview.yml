name: Nachrichtenportal Vorschau separat hochladen
on:
  push:
    paths:
      - "portal-preview.html"
      - "scripts/publish_portal_preview.py"
      - ".github/workflows/publish-portal-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'paramiko==3.5.1'
      - name: Nur isolierte Vorschau nach IONOS hochladen
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_SFTP_HOSTKEY_SHA256: ${{ secrets.IONOS_SFTP_HOSTKEY_SHA256 }}
        run: python3 scripts/publish_portal_preview.py
